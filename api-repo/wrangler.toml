name = "habeas-api"
# The token can read your memberships, so wrangler sees several accounts and refuses to guess in CI:
#   "More than one account available but unable to select one in non-interactive mode."
# An account id is an identifier, not a credential, and Cloudflare documents committing it. If you
# would rather it not sit in a public repo, move it to a CLOUDFLARE_ACCOUNT_ID secret and pass it
# as an env var from the workflow instead.
account_id = "7c636d71260f91bd91ad092f4d5c6012"
main = "worker.mjs"
compatibility_date = "2024-11-01"
workers_dev = false

# D1 binding — create the DB then paste its id here:
#   wrangler d1 create habeas-api
[[d1_databases]]
binding = "DB"
database_name = "habeas-api"
database_id = "29a2d336-6364-4a24-9769-32fb5592fba1"

# api.habeas.dev as a Worker Custom Domain — wrangler provisions the DNS record + TLS for you
# (habeas.dev is already a Cloudflare zone). No manual DNS entry needed.
[[routes]]
pattern = "api.habeas.dev"
custom_domain = true
