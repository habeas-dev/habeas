name: Store retry (Chrome Web Store)

# Chrome Web Store rejects a new package while the PREVIOUS submission is still "in review / ready to
# publish" (ITEM_NOT_UPDATABLE). The tag build's upload is best-effort, so a milestone released during that
# window never reaches the store until someone re-submits. This scheduled job re-attempts the upload of the
# LATEST GitHub release zip every few hours until it lands, then quietly no-ops.
#
# Why re-attempting is safe (no churn, no accidental re-review): CWS requires the uploaded version to be
# strictly GREATER than the published one, so once the latest release is live a re-upload is rejected as a
# no-op; while a predecessor is in review it returns ITEM_NOT_UPDATABLE — also a no-op. It only does real work
# when the store is genuinely BEHIND and the queue has cleared. Firefox/AMO isn't retried here: it accepts new
# versions immediately on the tag build (no in-review queue block), so it's never left behind.
#
# ⚠️ RE-ENABLED 2026-08-11, while the corrected listing is still in review. Disable again with:
#    gh workflow disable store-retry.yml
#
# The "re-attempting is safe" reasoning above holds for a QUEUE BLOCK (a predecessor still in review).
# It does NOT hold for a POLICY REJECTION. On 2026-08-11 the CWS rejected the listing for keyword spam
# (~24 brand names in the description, ref. Yellow Argon). After a rejection the published version is
# behind the latest release, so this job stops no-op'ing and starts genuinely re-uploading and
# re-publishing every 6 hours — which (a) keeps the item permanently "in review", and the dashboard
# refuses listing edits in that state, so the very fix cannot be applied; and (b) repeatedly resubmits
# content the reviewer already flagged, which risks escalating beyond a rejection.
#
# So: when a submission is rejected on POLICY, disable this job, fix the listing by hand in the
# dashboard, then re-enable. (During review the upload returns ITEM_NOT_UPDATABLE and no-ops, so an
# active retry is harmless UNTIL a rejection lands — at which point it resumes re-publishing and
# blocks dashboard edits again. If a second rejection arrives, disable it FIRST, before editing.) Note the listing description is NOT something this job
# could ever fix — the CWS API only uploads and publishes the PACKAGE; the detailed description,
# screenshots and category exist only in the dashboard. The package controls the title and summary only
# (manifest / _locales).

# The step is continue-on-error, so a no-op cycle keeps the JOB green (no failure notifications) — the red ✗ on
# the upload step is just informational. Firefox is unaffected.

on:
  schedule:
    - cron: '23 */6 * * *' # every 6 hours
  workflow_dispatch: {} # manual "try the store now" button

permissions:
  contents: read # read + download the latest release asset

jobs:
  cws-retry:
    runs-on: ubuntu-latest
    env:
      HAS_CWS: ${{ secrets.CWS_REFRESH_TOKEN != '' }}
    steps:
      - name: Download the latest release zip
        if: env.HAS_CWS == 'true'
        id: dl
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The HIGHEST published version only — never an older one. Pick by semver (sort -V), not GitHub's
          # "Latest" heuristic (which can key off date and mislead after a re-tag): if 0.9.0 and 0.9.1 both
          # failed to upload, only 0.9.1 is ever retried.
          tag=$(gh release list --repo "$GITHUB_REPOSITORY" --json tagName,isDraft,isPrerelease \
                  --jq '.[] | select(.isDraft==false and .isPrerelease==false) | .tagName' | sort -V | tail -1)
          echo "Highest release: $tag"
          [ -n "$tag" ] || { echo 'no release to retry'; exit 0; }
          # web-ext names the zip from the extension's `name`, so this must not assume a fixed prefix:
          # renaming the extension (0.9.11, "Habeas — export receipts & invoices") changed it from
          # habeas-X.Y.Z.zip to habeas_export_receipts_invoices-X.Y.Z.zip and this silently stopped
          # finding any asset — the retry looked green while never uploading anything.
          gh release download "$tag" --repo "$GITHUB_REPOSITORY" --pattern '*.zip' --dir dist
          zip=$(ls dist/*.zip 2>/dev/null | head -1)
          echo "Zip: ${zip:-<none>}"
          [ -n "$zip" ] || { echo "::error::release $tag has no .zip asset"; exit 1; }
          echo "path=$zip" >> "$GITHUB_OUTPUT"
        continue-on-error: true

      - name: Re-attempt Chrome Web Store upload
        if: env.HAS_CWS == 'true' && steps.dl.outputs.path != ''
        # No-op when the store is already current (version not greater → rejected) or a predecessor is still in
        # review (ITEM_NOT_UPDATABLE). Only publishes when CWS is genuinely behind and the queue is clear.
        continue-on-error: true
        uses: mnao305/chrome-extension-upload@v5.0.0
        with:
          file-path: ${{ steps.dl.outputs.path }}
          extension-id: ${{ secrets.CWS_EXTENSION_ID }}
          client-id: ${{ secrets.CWS_CLIENT_ID }}
          client-secret: ${{ secrets.CWS_CLIENT_SECRET }}
          refresh-token: ${{ secrets.CWS_REFRESH_TOKEN }}
          publish: true
