name: Refresh sources catalog

# Keep everything the site derives from the live registry in sync: the STATIC pre-rendered catalog in
# docs/sources.html (a no-JS fallback), the per-source guide pages under /download/ and /es/descargar/
# (built from each source's own `content`), and the sitemap that lists them. Publishing a source to the
# registry is therefore all it takes to publish its guide — nothing to do by hand on the website side.
# Runs a few times a day; commits ONLY when something actually changed, so it's quiet between source
# publishes. A push to main redeploys GitHub Pages automatically. [skip ci] on the commit keeps it from
# triggering the extension build.
on:
  schedule:
    - cron: '0 */6 * * *' # every 6 hours (00, 06, 12, 18 UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-sources
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the sitemap's <lastmod> is each file's last COMMIT date, and a shallow
          # checkout leaves `git log -- <file>` empty, so every page fell back to its mtime — the
          # checkout time. Every page then claimed to have changed today, every day, which produced
          # a pointless daily commit and taught crawlers to ignore the field.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Order matters: the guide builder writes docs/guides.json, which the catalog links from.
      - name: Rebuild the per-source guide pages
        run: node docs/tools/build-source-pages.mjs
      - name: Re-bake the static catalog from the live index
        run: node docs/tools/render-sources.mjs
      - name: Rebuild the sitemap
        run: node docs/tools/build-sitemap.mjs

      - name: Rebuild llms.txt
        # Lists the supported services and the guide pages, so it goes stale the moment the catalogue moves.
        run: node docs/tools/build-llms-txt.mjs
      - name: Commit if anything changed
        run: |
          if git diff --quiet -- docs/; then
            echo "catalog, guides and sitemap unchanged — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/
          git commit -m "docs(sources): auto-refresh catalog, guides and sitemap [skip ci]"
          git push
