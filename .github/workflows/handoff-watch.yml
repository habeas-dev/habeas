name: Handoff inbox watch

# Someone who bothers to record a source and send it should not be met with silence. This polls the
# handoff inbox and opens (or updates) a single issue while anything is waiting for a reply, closing it
# again once the queue is clear.
#
# The API already decides what "waiting" means (`waitingForTeam`): a fresh submission, or one where the
# contributor sent the last message. Terminal states (published / completed / declined / superseded)
# never wait. So this job carries no state of its own and cannot drift out of sync.
#
# PRIVACY: this repository is public and so are its workflow logs. The submission `handle` and `domain`
# would link a named contributor to a service they hold an account with — on a project whose whole
# argument is privacy. So NOTHING but a count ever leaves this job: no ids, no handles, no domains. Open
# the inbox yourself for the detail.
#
# Needs the `HABEAS_ADMIN_TOKEN` secret (the Worker's ADMIN_TOKEN). Without it the job no-ops.

on:
  schedule:
    - cron: '17 */2 * * *' # every 2 hours, off the hour to avoid the top-of-hour rush
  workflow_dispatch: {}

permissions:
  issues: write

concurrency:
  group: handoff-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    env:
      HAS_TOKEN: ${{ secrets.HABEAS_ADMIN_TOKEN != '' }}
    steps:
      - name: Count submissions waiting for a reply
        if: env.HAS_TOKEN == 'true'
        id: count
        env:
          TOKEN: ${{ secrets.HABEAS_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # -f so an auth failure or an outage fails the step loudly instead of reporting "0 waiting",
          # which would look exactly like a healthy empty queue.
          body=$(curl -fsS --max-time 30 -H "authorization: Bearer $TOKEN" https://api.habeas.dev/handoff)
          waiting=$(printf '%s' "$body" | node -e '
            let s = ""; process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const rows = JSON.parse(s);
              const list = Array.isArray(rows) ? rows : rows.handoffs || [];
              // Count only. Anything else printed here would end up in a public log.
              process.stdout.write(String(list.filter((h) => h.waitingForTeam).length));
            });')
          echo "waiting=$waiting" >> "$GITHUB_OUTPUT"
          echo "$waiting submission(s) waiting for a reply"

      - name: Open, update or close the reminder issue
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          WAITING: ${{ steps.count.outputs.waiting }}
        run: |
          set -euo pipefail
          title="Handoff inbox: contributions waiting for a reply"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "$title in:title" \
                  --json number,title -q ".[] | select(.title == \"$title\") | .number" | head -1)

          if [ "$WAITING" -eq 0 ]; then
            if [ -n "$num" ]; then
              gh issue close "$num" --repo "$GITHUB_REPOSITORY" \
                --comment "Inbox is clear — nothing waiting for a reply."
              echo "closed #$num"
            else
              echo "inbox clear, nothing to do"
            fi
            exit 0
          fi

          text="**$WAITING** handoff submission(s) are waiting for a reply.

          Someone recorded a source and sent it in. Open the inbox to read them — deliberately not
          listed here, because this repository and its logs are public and pairing a contributor's
          handle with the service they use is exactly what this project exists to avoid.

          \`\`\`
          curl -H \"authorization: Bearer \$ADMIN_TOKEN\" https://api.habeas.dev/handoff
          \`\`\`

          Flow and reply steps: [docs/ASSISTED-AUTHORING.md](docs/ASSISTED-AUTHORING.md).
          This issue closes itself once the queue is clear."

          if [ -n "$num" ]; then
            gh issue edit "$num" --repo "$GITHUB_REPOSITORY" --body "$text"
            echo "updated #$num"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$text"
            echo "opened a new issue"
          fi
